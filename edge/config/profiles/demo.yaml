# Perfil "demo": valores de la maqueta. Editar y reiniciar para calibrar.
temperature:
  t1_warning: 32     # CALIBRAR: sala de pruebas ~29-29.5 C; se calienta el sensor con la mano
  t2_critical: 33
  hysteresis: 0.5
  consecutive_readings: 3
  rate_rise_enabled: false
  rate_rise_c_per_min: 8
  sampling_seconds: {normal: 5, warning: 3, critical: 1}
  sensor_min_interval_seconds: 2
humidity:
  on_below: 87        # CALIBRAR con la humedad de la sala (alrededor del sensor ~84-86 %)
  off_at: 90
  high_above: 95      # CALIBRAR con la humedad de la sala
  high_hysteresis: 3
  consecutive_readings: 3
  read_interval_seconds: 10
  telemetry_seconds: 60
security:
  correlation_window_seconds: 10
  validation_window_seconds: 5
  siren_max_seconds: 5
  unknown_person_cooldown_seconds: 10
  person_confidence: 0.70
  face_match_confidence: 0.80
