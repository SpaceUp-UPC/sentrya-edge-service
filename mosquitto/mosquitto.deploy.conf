# Broker desplegado (servidor accesible desde internet): solo con usuario y contrasena.
# Los usuarios salen de mosquitto/broker.env; el contenedor genera el archivo de
# contrasenas al arrancar (docker-compose.deploy.yml). Para tu laptop: mosquitto.conf.
listener 1883
allow_anonymous false
password_file /mosquitto/passwd

# Los mensajes QoS 1 pendientes sobreviven a un reinicio del broker.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
