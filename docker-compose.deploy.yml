# Broker MQTT para desplegar en un servidor (con usuario y contrasena).
# Uso:
#   cp mosquitto/broker.env.example mosquitto/broker.env   # y cambia las contrasenas
#   docker compose -f docker-compose.deploy.yml up -d
# Para desarrollo en tu laptop (sin contrasena) sigue usando docker-compose.yml.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentrya-mosquitto
    ports:
      - "1883:1883"
    env_file: mosquitto/broker.env
    volumes:
      - ./mosquitto/mosquitto.deploy.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    # Genera el archivo de contrasenas desde broker.env en cada arranque y lanza Mosquitto.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${EDGE_MQTT_USERNAME:?falta en mosquitto/broker.env}"
        : "$${EDGE_MQTT_PASSWORD:?falta en mosquitto/broker.env}"
        : "$${MONITORING_MQTT_USERNAME:?falta en mosquitto/broker.env}"
        : "$${MONITORING_MQTT_PASSWORD:?falta en mosquitto/broker.env}"
        rm -f /mosquitto/passwd
        mosquitto_passwd -c -b /mosquitto/passwd "$$EDGE_MQTT_USERNAME" "$$EDGE_MQTT_PASSWORD"
        mosquitto_passwd -b /mosquitto/passwd "$$MONITORING_MQTT_USERNAME" "$$MONITORING_MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/passwd
        chmod 0600 /mosquitto/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  mosquitto-data:
