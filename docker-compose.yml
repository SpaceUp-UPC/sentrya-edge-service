# Broker MQTT local para desarrollo y para la demo.
# La base de datos del edge NO va en Docker: es un archivo SQLite (edge/data/edge.db).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentrya-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
